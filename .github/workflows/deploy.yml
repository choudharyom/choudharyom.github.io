name: Deploy to GitHub Pages

on:
  push:
    branches:
      - om_8x

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GATSBY_AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          GATSBY_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          clean: true